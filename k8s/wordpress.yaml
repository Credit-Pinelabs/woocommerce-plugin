---
# WordPress + WooCommerce + PinePG Plugin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-demo
  namespace: plural-uat
  labels:
    app: wp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wp-demo
  template:
    metadata:
      labels:
        app: wp-demo
    spec:
      containers:
        - name: wordpress
          image: 154495061904.dkr.ecr.ap-south-1.amazonaws.com/plural-images/wp-demo-pinepg:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: WORDPRESS_DB_HOST
              value: wp-demo-db-svc.plural-uat.svc.cluster.local
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wp-demo-secrets
                  key: mysql-password
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_TABLE_PREFIX
              value: wp_
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: wp-demo-svc
  namespace: plural-uat
spec:
  selector:
    app: wp-demo
  ports:
    - name: http
      port: 80
      targetPort: 80