---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-demo-db
  namespace: plural-uat
  labels: { app: wp-demo-db }
spec:
  replicas: 1
  selector:
    matchLabels: { app: wp-demo-db }
  template:
    metadata:
      labels: { app: wp-demo-db }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wp-demo-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wordpress
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wp-demo-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: wp-demo-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-demo-db-pvc
  namespace: plural-uat
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: "10Gi" } }
  storageClassName: gp2
---
apiVersion: v1
kind: Service
metadata:
  name: wp-demo-db-svc
  namespace: plural-uat
spec:
  selector: { app: wp-demo-db }
  ports:
    - port: 3306
      targetPort: 3306